[project]
name = "pytorch-detector-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gianni", email = "gianni.casagrande.mail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sam3",
    "einops",        # imported by sam3 core, missing from its dependencies
    "pycocotools",   # imported by sam3 core, missing from its dependencies
    "psutil",        # imported by sam3 core, missing from its dependencies
    "torch==2.10.0",
    "torchvision>=0.25.0",
]

[project.scripts]
pytorch-detector-playground = "detector_playground:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "detector_playground"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
sam3 = { path = "../sam3", editable = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
